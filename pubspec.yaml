name: mulla_dart
description: Official Dart library for the Mulla payment gateway (MTN Mobile Money and Airtel Money, Rwanda). Server SDK plus a key-less public client for apps.
version: 0.1.1
homepage: https://github.com/kaykorw/mulla-dart-sdk
repository: https://github.com/kaykorw/mulla-dart-sdk
issue_tracker: https://github.com/kaykorw/mulla-dart-sdk/issues
topics:
  - payments
  - mobile-money
  - momo
  - rwanda
  - webhooks

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3
  http: ^1.5.0
  meta: ^1.11.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
